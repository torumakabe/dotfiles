# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Reference: https://github.com/microsoft/winget-cli#building-the-client
#
# Usage: 通常の対話型 PowerShell で winget configure -f configuration.dsc.yaml を実行する。
# Visual Studio ワークロードが不足している場合は UAC の承認が必要。
#
# Note: Most CLI tool versions are managed by mise (~/.config/mise/config.toml).
# DSC contains only: OS settings, GUI/CLI apps not managed by mise, and
# bootstrap tooling (mise itself).
properties:
  resources:
    - resource: Microsoft.Windows.Developer/DeveloperMode
      directives:
        description: "Enable Developer Mode"
        allowPrerelease: true
      settings:
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install PowerShell"
        allowPrerelease: false
      settings:
        id: Microsoft.PowerShell
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install git"
        allowPrerelease: false
      settings:
        id: Git.Git
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install PowerToys"
        allowPrerelease: false
      settings:
        id: Microsoft.PowerToys
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install DevToys"
        allowPrerelease: true
      settings:
        id: DevToys-app.DevToys
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install GitHub CLI"
        allowPrerelease: false
      settings:
        id: GitHub.cli
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install GitHub Copilot CLI"
        allowPrerelease: false
      settings:
        id: GitHub.Copilot
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: GitHubCopilotApp
      directives:
        description: "Install GitHub Copilot app"
        allowPrerelease: false
      settings:
        id: GitHub.CopilotApp
        source: winget
        ensure: Present
    - resource: PSDscResources/Script
      id: GitHubCopilotAppBlockingPin
      dependsOn:
        - GitHubCopilotApp
      directives:
        description: "Block WinGet from replacing the self-updating GitHub Copilot app"
      settings:
        GetScript: |
          $output = winget pin list --id GitHub.CopilotApp --exact --source winget --accept-source-agreements --disable-interactivity | Out-String
          return @{ Result = $output }
        TestScript: |
          $output = winget pin list --id GitHub.CopilotApp --exact --source winget --accept-source-agreements --disable-interactivity | Out-String
          return ($LASTEXITCODE -eq 0 -and $output -match '(?m)\bGitHub\.CopilotApp\s+\S+\s+winget\s+Blocking(?:\s|$)')
        SetScript: |
          winget pin remove --id GitHub.CopilotApp --exact --source winget --accept-source-agreements --disable-interactivity 2>$null
          winget pin add --id GitHub.CopilotApp --exact --source winget --blocking --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to add a blocking WinGet pin for GitHub.CopilotApp."
          }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install Azure Developer CLI"
        allowPrerelease: false
      settings:
        id: Microsoft.Azd
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install mise"
        allowPrerelease: false
      settings:
        id: jdx.mise
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        # rust-toolchain.toml を持つプロジェクトでの version pinning を機能させるため、
        # mise ではなく公式インストーラー (rustup) で管理する。
        # 詳細: docs/adr/016-rust-external-rustup.md
        description: "Install Rust (rustup)"
        allowPrerelease: false
      settings:
        id: Rustlang.Rustup
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: VisualStudioBuildTools
      directives:
        # cargo/rustc の windows-msvc ターゲットビルドに必要な MSVC リンカー (link.exe) を導入する。
        # C++ ワークロードはインストーラー引数が必要なため WinGetPackage 単体では指定できず、
        # 下の Script リソースで別途追加する。
        # link.exe が Coreutils for Windows 版と名前衝突する問題への対応は docs/adr/017-msvc-linker-env-var-override-windows.md
        description: "Install Visual Studio 2022 Build Tools"
        allowPrerelease: false
      settings:
        id: Microsoft.VisualStudio.2022.BuildTools
        source: winget
    - resource: PSDscResources/Script
      id: VisualStudioVCTools
      dependsOn:
        - VisualStudioBuildTools
      directives:
        description: "Ensure the MSVC x64 linker is installed via the C++ build tools workload (interactive UAC)"
      settings:
        GetScript: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $linker = if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
            & $vswhere -latest -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\link.exe'
          }
          return @{ Result = $linker | Out-String }
        TestScript: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            return $false
          }
          $linker = & $vswhere -latest -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\link.exe'
          return ($LASTEXITCODE -eq 0 -and ![string]::IsNullOrWhiteSpace(($linker | Out-String)))
        SetScript: |
          $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          if (!(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Visual Studio Installer was not found after installing Build Tools."
          }
          $arguments = @(
            'modify'
            '--productId', 'Microsoft.VisualStudio.Product.BuildTools'
            '--channelId', 'VisualStudio.17.Release'
            '--add', 'Microsoft.VisualStudio.Workload.VCTools'
            '--includeRecommended'
            '--quiet'
            '--wait'
            '--norestart'
          )
          try {
            $process = Start-Process -FilePath $setup -Verb RunAs -ArgumentList $arguments -Wait -PassThru -ErrorAction Stop
          }
          catch {
            throw "Visual Studio Installer requires approval of the UAC prompt in an interactive Windows session. $($_.Exception.Message)"
          }
          if ($null -eq $process -or $null -eq $process.ExitCode) {
            throw "Visual Studio Installer did not return an exit code after the elevated process completed."
          }
          if ($process.ExitCode -eq 3010) {
            Write-Warning "Visual Studio Build Tools was installed successfully, but Windows must be restarted before using the MSVC tools."
          }
          elseif ($process.ExitCode -ne 0) {
            throw "Visual Studio Installer failed with exit code $($process.ExitCode)."
          }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install Microsoft Edit"
        allowPrerelease: false
      settings:
        id: Microsoft.Edit
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        # 同梱の link.exe (ハードリンク作成コマンド) が MSVC リンカーと名前衝突する。
        # 対応: docs/adr/017-msvc-linker-env-var-override-windows.md
        description: "Install Coreutils for Windows"
        allowPrerelease: false
      settings:
        id: Microsoft.Coreutils
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install Azure CLI"
        allowPrerelease: false
      settings:
        id: Microsoft.AzureCLI
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install LibreOffice"
        allowPrerelease: false
      settings:
        id: TheDocumentFoundation.LibreOffice
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install Poppler"
        allowPrerelease: false
      settings:
        id: oschwartz10612.Poppler
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: "Install draw.io"
        allowPrerelease: false
      settings:
        id: JGraph.Draw
        source: winget
  configurationVersion: 0.2.0
