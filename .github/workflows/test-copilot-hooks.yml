name: Test Copilot Hooks
on:
  pull_request:
    paths:
      - 'home/**'
      - '.github/copilot-instructions.md'
      - '.github/agents/**'
      - 'tests/**'
      - 'docs/**'
      - 'reference/windows/**'
      - '.github/workflows/test-copilot-hooks.yml'
      - 'install.sh'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'home/**'
      - '.github/copilot-instructions.md'
      - '.github/agents/**'
      - 'tests/**'
      - 'docs/**'
      - 'reference/windows/**'
      - '.github/workflows/test-copilot-hooks.yml'
      - 'install.sh'
      - 'README.md'
  schedule:
    # Weekly Monday 00:00 UTC — detect fail-open regressions
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install and verify test shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          command -v zsh

      # chezmoi renders the config template in tests/test_chezmoi_config_template.py.
      # install.sh は版と checksum の正本なので、それを再利用すれば CI は実際の
      # bootstrap と同じバイナリで走る。runner に chezmoi が無い間は download と
      # checksum の経路も一緒に検査される。install.sh は PATH 上の chezmoi を
      # 優先するため、別版が現れたら次の version 検査が知らせる。
      - name: Install chezmoi
        run: |
          CHEZMOI_INSTALL_ONLY=1 ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify the tests get the pinned chezmoi
        run: |
          expected=$(sed -n 's/^CHEZMOI_VERSION="\(.*\)"$/\1/p' install.sh)
          [ -n "$expected" ] || { echo "install.sh からピン版を取得できない"; exit 1; }
          chezmoi --version | grep -F "v${expected}"

      # ── Unit tests (auto-discover all test_*.py) ──────────────────────
      - name: Run all unit tests
        run: uv run -m unittest discover -s tests -v

      # ── Smoke tests — copilot-guard ───────────────────────────────────
      - name: Smoke — copilot-guard denies .env access
        run: |
          RESULT=$(echo '{"toolName":"bash","toolArgs":{"command":"cat .env"}}' \
            | uv run home/private_dot_copilot/hooks/scripts/executable_copilot-guard.py)
          echo "$RESULT" | uv run python -c "import sys, json; d=json.load(sys.stdin); assert d['permissionDecision']=='deny', f'Expected deny, got {d}'"

      - name: Smoke — copilot-guard asks for hooks modification
        run: |
          RESULT=$(echo '{"toolName":"edit","toolArgs":{"path":"/home/user/.copilot/hooks/hooks.json"}}' \
            | uv run home/private_dot_copilot/hooks/scripts/executable_copilot-guard.py)
          echo "$RESULT" | uv run python -c "import sys, json; d=json.load(sys.stdin); assert d['permissionDecision']=='ask', f'Expected ask, got {d}'"

      # allow 側の smoke は tests/test_uv_enforcer.py と
      # tests/test_node_global_enforcer.py の TestMainIntegration が同じ payload で
      # 検査するため置かない。各 hook の代表例を残すのは、tests/_helpers.py の
      # run_hook が sys.executable で起動するのに対し、本番の hooks.json は
      # uv run で起動するためである。PEP 723 メタデータの破損はこの経路でしか
      # 出ない。copilot-guard は、自身の隣から読む blocked-files.txt と
      # ask-files.txt を deny と ask の各1件で検査する。
      - name: Smoke — uv-enforcer denies bare python
        run: |
          RESULT=$(echo '{"toolName":"bash","toolArgs":{"command":"python script.py"}}' \
            | uv run home/private_dot_copilot/hooks/scripts/executable_uv-enforcer.py)
          echo "$RESULT" | uv run python -c "import sys, json; d=json.load(sys.stdin); assert d['permissionDecision']=='deny', f'Expected deny, got {d}'"

      - name: Smoke — node-global-enforcer denies npm install -g
        run: |
          RESULT=$(echo '{"toolName":"bash","toolArgs":{"command":"npm install -g typescript"}}' \
            | uv run home/private_dot_copilot/hooks/scripts/executable_node-global-enforcer.py)
          echo "$RESULT" | uv run python -c "import sys, json; d=json.load(sys.stdin); assert d['permissionDecision']=='deny', f'Expected deny, got {d}'"

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CHEZMOI_WINDOWS_AMD64_SHA256: b01b6d449db1e4ca62694482d53ab8395c891cade237c404defc1701ebd2bf66
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install and verify the pinned chezmoi
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path install.sh -Pattern '^CHEZMOI_VERSION="([^"]+)"$'
          if ($null -eq $versionMatch) {
              throw 'install.sh からピン版を取得できない'
          }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $archive = "chezmoi_${version}_windows_amd64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          $binDir = Join-Path $env:RUNNER_TEMP 'chezmoi-bin'

          Invoke-WebRequest `
              -Uri "https://github.com/twpayne/chezmoi/releases/download/v${version}/${archive}" `
              -OutFile $archivePath
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:CHEZMOI_WINDOWS_AMD64_SHA256) {
              throw "chezmoi checksum mismatch: expected $env:CHEZMOI_WINDOWS_AMD64_SHA256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $binDir
          $chezmoi = Join-Path $binDir 'chezmoi.exe'
          $versionOutput = & $chezmoi --version
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch [regex]::Escape("v${version}")) {
              throw "unexpected chezmoi version: $versionOutput"
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run all unit tests
        shell: pwsh
        run: |
          foreach ($command in @('pwsh', 'uv', 'git', 'chezmoi')) {
              if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
                  throw "Required command is unavailable: $command"
              }
          }
          $env:PYTHONUTF8 = '1'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          uv run -m unittest discover -s tests -v
