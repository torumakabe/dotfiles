[typescriptLsp]
version = "6.0.3"

[specKit]
version = "1.0.1"

# 以下は「こうあってほしい状態」の宣言だけを置く。インストーラーはこのファイルを
# 書き換えない。値を更新するときは、上流の公式リリースで版と SHA-256 を確認する。

# GitHub CLI は OS/ベンダーのパッケージマネージャーが所有する。ここでは本リポジトリの
# 挙動が要求する最小版だけを宣言する。最小版以上なら更新しない。
# gh skill list / gh skill install は 2.94.0 以降でのみ利用できる。
[githubCli]
minimumVersion = "2.94.0"

# jq は公式リリースの検証済みバイナリを直接導入する。
[jq]
version = "1.8.2"
releaseBaseUrl = "https://github.com/jqlang/jq/releases/download"

# assets のキーは "<chezmoi.os>-<chezmoi.arch>"。ここに無い組み合わせは非対応であり、
# 別 CPU 向けの asset へ暗黙にフォールバックしない。
# SHA-256 の出所は各リリースの sha256sum.txt。
[jq.assets.linux-amd64]
file = "jq-linux-amd64"
sha256 = "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f"

[jq.assets.linux-arm64]
file = "jq-linux-arm64"
sha256 = "8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309"

[jq.assets.darwin-amd64]
