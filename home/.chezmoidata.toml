# TypeScript グローバル CLI (tsc/tsserver コマンド)。専用 npm prefix へ導入する。
# 利用中のミラーレジストリは dist.integrity (SHA-512) を提供しないため、
# 実在しない検証を主張しない。npm 自身が dist.shasum (SHA-1) で検証する。
# 専用 LSP 用の TypeScript ([typescriptLsp], tsserver.js 参照専用) とは別管理。
[typescriptCli]
version = "7.0.2"

# typescript-language-server (LSP 実行体)。専用 npm prefix へ導入する。
# initializationOptions.tsserver.path で [typescriptLsp] の tsserver.js を指す。
[typescriptLanguageServer]
version = "6.0.0"
