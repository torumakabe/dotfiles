# .NET SDK は公式アーカイブ (builds.dotnet.microsoft.com) を直接導入する。
# 版と実体は release-metadata の SHA-512 (`hash` フィールド) で検証する。
# 出所: https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json
# 「他が所有する .NET SDK」と衝突しないよう、DOTNET_ROOT は設定せず、専用
# root 内の dotnet 実体が自分の sdk/ だけを見る形で共存させる。
[dotnet]
version = "10.0.400"
downloadBaseUrl = "https://builds.dotnet.microsoft.com/dotnet/Sdk"

