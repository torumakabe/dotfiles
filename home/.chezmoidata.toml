# uv は upstream 推奨の公式インストーラーを、版を含む固定 URL で取得して実行する。
# astral.sh/uv/<version>/install.{sh,ps1} は同じ成果物へのリダイレクトであり、
# リダイレクト先を固定するためリリース asset の URL を直接指定する。
[uv]
version = "0.12.9"
installerBaseUrl = "https://github.com/astral-sh/uv/releases/download"
shInstallerSha256 = "222e006c0fe4a0d793031833e469b21df72311f4e3526ffecca0e19e6dfabc32"
ps1InstallerSha256 = "69de475bf929f1ac248efb5a85189177a45517e2346cd68762bde453fec10a6b"

